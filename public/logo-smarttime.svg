<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 20 1040 870" role="img" aria-labelledby="title desc">
<title id="title">SmartTime Time Gold</title>
<desc id="desc">Premium black and gold SmartTime emblem with crown, clock and hourglass on a white background</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff0a0"/><stop offset=".18" stop-color="#c88a19"/><stop offset=".38" stop-color="#ffe58a"/><stop offset=".58" stop-color="#a86c0c"/><stop offset=".78" stop-color="#f7d36a"/><stop offset="1" stop-color="#8c5708"/></linearGradient>
 <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8c8"/><stop offset=".48" stop-color="#e4ad32"/><stop offset="1" stop-color="#a86a0a"/></linearGradient>
 <linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292929"/><stop offset=".45" stop-color="#050505"/><stop offset="1" stop-color="#161616"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d4d4d4"/><stop offset=".3" stop-color="#fff"/><stop offset=".7" stop-color="#f2f2f2"/><stop offset="1" stop-color="#b7b7b7"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#6b480d" flood-opacity=".18"/></filter>
</defs>
<rect width="1200" height="1150" fill="#fff"/>
<g filter="url(#shadow)" stroke-linejoin="round">
 <!-- Crown -->
 <path d="M485 142 L442 80 L508 111 L550 42 L594 108 L655 76 L628 142 Z" fill="url(#gold)" stroke="#8f5b0a" stroke-width="6"/>
 <path d="M475 151 H641 L628 170 H489 Z" fill="url(#gold)" stroke="#a36b12" stroke-width="4"/>
 <!-- Clock behind S -->
 <circle cx="488" cy="394" r="177" fill="url(#black)" stroke="url(#gold)" stroke-width="15"/>
 <circle cx="488" cy="394" r="151" fill="#080808" stroke="#c68d21" stroke-width="5"/>
 <g stroke="url(#gold)" stroke-width="11" stroke-linecap="round">
  <path d="M488 270 V293 M488 495 V518 M364 394 H387 M589 394 H612 M400 306 L416 323 M560 466 L576 482 M400 482 L416 466 M560 323 L576 306"/>
  <path d="M488 394 L575 307" stroke-width="13"/>
 </g>
 <circle cx="488" cy="394" r="14" fill="url(#gold)"/>
 <!-- Stylized S -->
 <path d="M279 260 C275 206 326 178 389 178 H547 C588 178 613 198 613 230 C613 260 588 278 550 278 H428 C394 278 376 295 376 320 C376 343 397 360 428 360 H520 C573 360 603 390 603 434 C603 489 562 527 497 527 H329 C274 527 239 493 239 448 C239 417 257 392 285 378 L326 356 C293 351 270 334 270 309 C270 288 275 273 279 260 Z" fill="url(#black)" stroke="url(#gold)" stroke-width="9"/>
 <!-- T -->
 <path d="M598 188 H932 L901 232 C885 254 865 263 832 263 H787 C755 263 737 285 737 320 V520 H666 V313 C666 261 700 224 753 224 H787 L810 207 H624 Z" fill="url(#black)" stroke="url(#gold)" stroke-width="9"/>
 <!-- Gold speed strokes -->
 <g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round">
  <path d="M620 450 Q689 397 752 377"/>
  <path d="M610 486 Q683 438 753 421"/>
  <path d="M592 522 Q672 480 742 465"/>
  <path d="M573 556 Q654 520 723 507"/>
 </g>
 <!-- Hourglass and sweeping line -->
 <path d="M835 350 Q930 285 1014 330 Q1068 358 1042 403 Q1019 439 969 455" fill="none" stroke="url(#gold)" stroke-width="10"/>
 <path d="M827 374 Q922 331 990 363" fill="none" stroke="url(#goldLight)" stroke-width="7"/>
 <g transform="translate(878 350)">
  <rect x="0" y="0" width="145" height="26" rx="7" fill="url(#black)" stroke="url(#gold)" stroke-width="7"/>
  <rect x="0" y="260" width="145" height="26" rx="7" fill="url(#black)" stroke="url(#gold)" stroke-width="7"/>
  <path d="M18 28 H127 C126 66 112 83 91 105 L77 123 L91 142 C112 163 126 187 127 232 H18 C19 187 33 163 54 142 L68 123 L54 105 C33 83 19 66 18 28 Z" fill="url(#glass)" stroke="url(#gold)" stroke-width="7"/>
  <path d="M34 48 H111 C107 74 94 89 76 107 C59 89 38 74 34 48 Z" fill="#fff" opacity=".8"/>
  <path d="M76 115 L57 145 Q47 162 42 187 H110 Q105 162 95 145 Z" fill="url(#gold)"/>
  <path d="M43 187 Q76 176 109 187 L112 225 H40 Z" fill="url(#gold)" opacity=".9"/>
  <path d="M26 35 H119 M26 245 H119" stroke="#fff1b2" stroke-width="3" opacity=".8"/>
 </g>
</g>
<!-- Wordmark -->
<text x="600" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="bold" letter-spacing="-5" fill="#080808">Smart<tspan fill="url(#gold)">Time</tspan></text>
<path d="M140 845 H355 M845 845 H1060" stroke="url(#gold)" stroke-width="6"/>
<text x="600" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="22" fill="#b27a18">TIME GOLD</text>
</svg>