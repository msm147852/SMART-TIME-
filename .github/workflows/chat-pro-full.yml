name: Chat Pro Full CI

on:
  push:
    branches: [main, feat/chat-pro-full]
  pull_request:
    branches: [main]
    paths:
      - 'backend/chatServer.ts'
      - 'backend/database.ts'
      - 'src/components/AddMemberModal.tsx'
      - 'src/components/ChatSettingsModal.tsx'
      - 'src/components/HotChatView.tsx'
      - 'src/components/VoiceRoomModal.tsx'
      - 'src/components/LiveKitCallModal.tsx'
      - 'src/components/chat/CreateVoiceRoomModal.tsx'
      - 'src/components/chat/CreateVideoRoomModal.tsx'
      - 'src/components/chat/VoiceRoomView.tsx'
      - 'src/hooks/useVoiceRoom.ts'
      - 'src/config/voice.ts'
      - 'scripts/verify-chat-p2p.mjs'
      - 'src/services/chatService.ts'
      - 'scripts/verify-chat-pro-full.mjs'
      - 'package.json'
      - '.github/workflows/chat-pro-full.yml'

jobs:
  chat-pro-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify:chat-pro-full
      - run: npm run verify:chat-p2p
      - run: npm run lint
      - run: npm run build
