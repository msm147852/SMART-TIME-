name: Build V9 Preview ZIP

on:
  push:
    branches:
      - v9-adaptive-foundation

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Create exact source archive
        run: git archive --format=zip --output=SMART-TIME-v9-adaptive-foundation.zip HEAD

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMART-TIME-v9-adaptive-foundation
          path: SMART-TIME-v9-adaptive-foundation.zip
          if-no-files-found: error
