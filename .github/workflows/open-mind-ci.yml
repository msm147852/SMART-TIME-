name: OPEN MIND AI CI

on:
  pull_request:
    paths:
      - "backend/ai/**"
      - "tools/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/open-mind-ci.yml"

jobs:
  open-mind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:open-mind
      - run: npm run build
